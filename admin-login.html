<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#12345a">
  <title>Admin sign in | Balchand P.P. Public School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
</head>
<body class="admin-login-body">
  <main class="admin-login-card">
    <a href="/" class="admin-brand mb-4">
      <span class="brand-mark">BP</span>
      <span><strong>School website</strong><small>Administration</small></span>
    </a>
    <p class="section-kicker mb-2">Secure access</p>
    <h1 class="h2">Sign in to manage the site</h1>
    <p class="text-secondary">Use an admin account created by the site owner.</p>
    <div id="loginAlert" class="alert d-none" role="alert"></div>
    <form id="loginForm">
      <div class="mb-3"><label class="form-label" for="loginEmail">Email</label><input class="form-control" id="loginEmail" type="email" autocomplete="username" required maxlength="254"></div>
      <div class="mb-4"><label class="form-label" for="loginPassword">Password</label><input class="form-control" id="loginPassword" type="password" autocomplete="current-password" required maxlength="200"></div>
      <button class="btn btn-school w-100" type="submit">Sign in</button>
    </form>
    <a href="/" class="d-inline-block mt-4">Return to the school website</a>
  </main>
  <script src="assets/js/login.js"></script>
</body>
</html>
